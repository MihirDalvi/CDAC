<!DOCTYPE html>
<head>
<link rel="stylesheet" href="registerationform.css"/>    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@300..700&family=Raleway:wght@200;400&display=swap" rel="stylesheet">
<!-- CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

<!-- jquery -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

<title>Registration Form</title>
</head>
<body>
  <div class="container">
    <form>
        <div class="register">REGISTERATION FORM</div>  
      <div class="personalinfo">PERSONAL INFORMATION</div>
      
       <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" placeholder="Enter your full name" />
     </div>

     <div class="form-group">
        <label for="nickname">Nickname</label>
        <input type="text" class="form-control"  placeholder="Enter your nick name" />
    </div>
        
    <div class="form-group">
        <label for="pob">Place of Birth</label>
        <input type="text" class="form-control"  placeholder="Place of birth" />
    </div>
        
    <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" class="form-control"  placeholder="Date of Birth"  />
    </div>

    <div class="form-group">
        <label for="nationality">Nationality</label>
        <input type="text" class="form-control" placeholder="Enter your nationality" />
    </div>
    
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" placeholder="Enter your email"  />
    </div>

    <div class="form-group">
        <label for="domcile">Domcile</label>
        <input type="text" class="form-control" placeholder="Enter your Domcile"  />
    </div>

    <div class="form-group ">
        <label for="gender">Gender</label>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="x" id="y" value="male">
        <label class="form-check-label" for="inlineRadio1">Male</label>
    </div>
    <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="x" id="z" value="female">
        <label class="form-check-label" for="inlineRadio2">Female</label>
    </div>
    </div>

    <div class="form-group">
        <label for="cpdomcile">CP Domcile</label>
        <input type="text" class="form-control" placeholder="Enter your CP Domcile" />
    </div>

    <div class="form-group">
    <label for="Maritalstatus">Marital status</label>    
    <select>
        <option class="default">--default--</option>
        <option value="m1">Married</option>
        <option value="s1">Single</option>
        <option value="w1">Widow</option>
    </select>
    </div>
    
    <div class="form-group">
        <label for="number">Phone</label>
        <input type="number" class="form-control" placeholder="Enter your mobile no" />
    </div>

        <div class="personalinfo">ADDRESS</div>

    <div class="form-group">
        <label for="address">Address</label>
        <textarea class="form-control" placeholder="Address"> </textarea>
    
    </div class="form-group">    
        <label for="address">Pincode</label>
        <input type="text" class="form-control" placeholder="Enter the pincode" />
    </div>

    <div class="form-group">
        <label for="address">State</label>
        <input type="text" class="form-control" placeholder="Enter the state" />
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>
  </div>
</body>
</html>
